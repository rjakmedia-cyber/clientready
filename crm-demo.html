<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM | clientReady</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070b;--panel:#0e131c;--panel2:#121927;--panel3:#0a0f17;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);--text:#e9eef6;--muted:#8a95a8;--dim:#5d677a;--a1:#4fd1ff;--a2:#5271ff;--ok:#3ee6a8;--warn:#ffc46b;--bad:#ff8a8a;--ease:cubic-bezier(.16,1,.3,1);--sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-color:#253043 var(--bg)}
::selection{background:rgba(79,209,255,.28);color:#fff}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--a1);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--a1);outline-offset:2px;border-radius:6px}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;font-size:14px;color:var(--text);background:var(--panel3);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;outline:none;caret-color:var(--a1);transition:border-color .15s,box-shadow .15s;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--a1);box-shadow:0 0 0 3px rgba(79,209,255,.12)}
input[type=checkbox]{accent-color:var(--a1);width:16px;height:16px}
textarea{width:100%;min-height:76px;resize:vertical}
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:10px;padding:7px 12px;font-size:13.5px;font-weight:600;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:rgba(79,209,255,.5)}
.btn.pri{background:linear-gradient(90deg,var(--a1),var(--a2));color:#04060a;border:0}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:rgba(255,138,138,.6);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:progress}
.link{background:none;border:0;color:var(--a1);font-size:13px;padding:0;text-decoration:underline;text-underline-offset:3px}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.mono{font-family:var(--mono);font-size:12.5px}

/* login */
#login{max-width:420px;margin:12vh auto;padding:30px;background:var(--panel);border:1px solid var(--line2);border-radius:18px}
#login h1{font-size:22px;margin-bottom:6px}
#login p{color:var(--muted);font-size:14px;margin-bottom:16px}
#login input{width:100%;margin-bottom:12px}
#login .err{color:var(--bad);font-size:14px;margin-top:10px;min-height:20px}
#app{display:none}

/* top */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 20px;background:rgba(5,7,11,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top img{height:17px;width:auto}
.nav{display:flex;gap:4px;margin-left:10px;padding:3px;border-radius:12px;background:var(--panel3);border:1px solid var(--line)}
.nav button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:9px;font-weight:600;font-size:13.5px}
.nav button[aria-current=page]{background:var(--panel2);color:var(--text)}
.nav b{display:inline-block;min-width:18px;margin-left:6px;padding:0 5px;border-radius:999px;background:var(--bad);color:#1a0505;font-size:11px;line-height:17px;text-align:center}
.top .sp{flex:1}
.top input[type=search]{width:220px}
main{padding:18px 20px 60px}

/* today */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi b{display:block;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:13px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.box>h2{font-size:15px;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.box>h2 small{color:var(--dim);font-weight:400}
.need{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}
.need:last-child{border-bottom:0}
.need .who{color:var(--muted);font-size:13px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.tag.red{background:rgba(255,138,138,.14);color:var(--bad)}.tag.amber{background:rgba(255,196,107,.13);color:var(--warn)}
.tag.blue{background:rgba(79,209,255,.12);color:var(--a1)}.tag.green{background:rgba(62,230,168,.12);color:var(--ok)}.tag.grey{background:rgba(255,255,255,.06);color:var(--muted)}
.empty{padding:28px 16px;color:var(--muted);text-align:center}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}

/* clients */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line2);background:transparent;color:var(--muted);border-radius:999px;padding:4px 10px;font-size:12.5px}
.chip b{color:var(--text);font-variant-numeric:tabular-nums;margin-left:4px}
.chip[aria-pressed=true]{background:var(--panel2);color:var(--text);border-color:rgba(79,209,255,.5)}
.panes{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;align-items:start}
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:sticky;top:70px;max-height:calc(100vh - 150px);overflow-y:auto}
.row{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(255,255,255,.02)}
.row[aria-current=true]{background:var(--panel2);box-shadow:inset 2px 0 0 var(--a1)}
.row .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .e{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{text-align:right;font-size:12px;color:var(--dim);white-space:nowrap}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:rgba(255,255,255,.06);color:var(--muted);white-space:nowrap}
.s-reserved,.s-checkout{color:var(--warn)!important;background:rgba(255,196,107,.1)!important}
.s-paid,.s-onboarding{color:var(--a1)!important;background:rgba(79,209,255,.1)!important}
.s-building,.s-warmup{color:#a9b6ff!important;background:rgba(82,113,255,.14)!important}
.s-live,.s-fullspeed{color:var(--ok)!important;background:rgba(62,230,168,.1)!important}
.s-paused,.s-cancelled{color:var(--dim)!important}
.dot{display:inline-block;min-width:17px;margin-left:6px;padding:0 5px;border-radius:999px;background:var(--bad);color:#1a0505;font-size:10.5px;font-weight:700;line-height:16px;text-align:center}

/* workspace */
.ws{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-height:400px}
.ws .ph{color:var(--muted);text-align:center;padding:90px 20px}
.wsh{padding:18px 20px 0}
.wsh h2{font-size:21px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wsh .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin:14px 0 0}
.ctl label{font-size:11.5px;color:var(--dim);display:grid;gap:3px}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 14px;margin-top:14px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;color:var(--muted);padding:10px 10px;font-weight:600;font-size:13.5px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--a1)}
.tabs i{font-style:normal;color:var(--dim);font-weight:500;margin-left:4px;font-size:12px}
.tabs i.hot{color:var(--bad)}
.pane{padding:18px 20px 24px}
.sec{margin-bottom:22px}
.sec>h3{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec>h3 small{color:var(--dim);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px;background:rgba(5,7,11,.35)}
.stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stat span{color:var(--dim);font-size:12px}
.bar{height:7px;border-radius:7px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a2));border-radius:7px}
.form{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:12px;background:rgba(5,7,11,.3);margin-bottom:14px}
.form .r{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.form label{display:grid;gap:3px;font-size:11.5px;color:var(--dim)}
.form .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.chk{display:flex!important;align-items:center;gap:6px;font-size:13px!important;color:var(--muted)!important}
.task{display:grid;grid-template-columns:22px 1fr 130px auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.task.done .tt{color:var(--dim);text-decoration:line-through}
.task.late .due{border-color:rgba(255,138,138,.55);color:var(--bad)}
.task input[type=date]{padding:4px 7px;font-size:12.5px}
.grp{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 2px;font-weight:600}
.eye{border:1px solid var(--line2);background:transparent;border-radius:8px;padding:3px 7px;font-size:11.5px;color:var(--dim)}
.eye[aria-pressed=true]{color:var(--a1);border-color:rgba(79,209,255,.45)}
.card{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}
.card.hot{border-color:rgba(255,138,138,.4)}
.card .h{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.card .h b{font-size:14.5px}
.card .body{white-space:pre-wrap;color:var(--muted);font-size:13.5px;max-height:160px;overflow:auto}
.card .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.note{margin-top:8px;padding:9px 11px;border-radius:10px;background:rgba(255,196,107,.07);border:1px solid rgba(255,196,107,.25);font-size:13.5px;white-space:pre-wrap}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:500;font-size:11.5px}
td select{padding:3px 6px;font-size:12.5px}
.kv{display:grid;grid-template-columns:minmax(120px,210px) 1fr;gap:5px 14px;font-size:13.5px}
.kv dt{color:var(--dim)}
.kv dd{white-space:pre-wrap;word-break:break-word}
.log{list-style:none;font-size:13px;color:var(--muted);display:grid;gap:5px}
.log time{color:var(--dim);font-family:var(--mono);font-size:11.5px;margin-right:8px}
.up{border-left:2px solid var(--a2);padding:2px 0 2px 12px;margin:10px 0;white-space:pre-wrap}
.up .when{display:block;color:var(--dim);font-size:12px}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:10px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-height:300px;display:flex;flex-direction:column}
.col h3{font-size:13px;padding:11px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.col h3 span{color:var(--dim);font-weight:500}
.col .drop{padding:8px;display:grid;gap:8px;align-content:start;flex:1;border-radius:0 0 14px 14px;transition:background .15s}
.col .drop.over{background:rgba(79,209,255,.06)}
.bc{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:grab;font-size:13px}
.bc b{display:block;font-size:13.5px}
.bc span{color:var(--muted);font-size:12px}
.bc.dragging{opacity:.4}

.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;background:var(--panel2);border:1px solid var(--line2);padding:10px 16px;border-radius:12px;font-size:14px;transition:opacity .25s var(--ease),transform .25s var(--ease);pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}
dialog{margin:auto;background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:16px;padding:22px;width:min(560px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin-bottom:12px}
dialog label{display:grid;gap:4px;font-size:12.5px;color:var(--muted);margin-bottom:10px}
dialog textarea{min-height:230px;font-size:13.5px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){.panes{grid-template-columns:1fr}.list{position:static;max-height:340px}.top{flex-wrap:wrap}.top input[type=search]{width:100%;order:9}.task{grid-template-columns:22px 1fr;}.task .due,.task .eye,.task .x{grid-column:2}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="login">
  <img src="logo.png" alt="clientReady" style="height:20px;width:auto;margin-bottom:18px">
  <h1>Client CRM</h1>
  <p>Use the same admin key as your leads dashboard. It stays saved on this device only.</p>
  <form id="loginForm"><input type="password" id="key" placeholder="Admin key" autocomplete="current-password" required><button class="btn pri" style="width:100%">Open CRM</button></form>
  <div class="err" id="loginErr" role="alert"></div>
</div>

<div id="app">
  <div class="top">
    <img src="logo.png" alt="clientReady">
    <nav class="nav" aria-label="CRM views">
      <button data-view="today" aria-current="page">Today<b id="needCount" hidden></b></button>
      <button data-view="clients">Clients</button>
      <button data-view="board">Board</button>
    </nav>
    <span class="sp"></span>
    <input type="search" id="q" placeholder="Search name, company, email" aria-label="Search clients">
    <button class="btn" id="addBtn">Add client</button>
    <button class="btn ghost" id="exportBtn" title="Download every client as a spreadsheet">Export</button>
    <button class="btn ghost" id="refresh">Reload</button>
    <button class="btn ghost" id="logout">Log out</button>
  </div>
  <main>
    <section id="vToday"></section>
    <section id="vClients" hidden>
      <div class="chips" id="chips" role="toolbar" aria-label="Filter by stage"></div>
      <div class="panes"><div class="list" id="list"></div><div class="ws" id="ws"><div class="ph">Pick a client to open their workspace.</div></div></div>
    </section>
    <section id="vBoard" hidden><div class="board" id="board"></div><p class="dim" style="margin-top:10px;font-size:13px">Drag a card to change its stage, or click it to open the client.</p></section>
  </main>
</div>

<dialog id="addDlg">
  <form id="addForm" method="dialog">
    <h3>Add a client by hand</h3>
    <label>Email<input type="email" name="email" required></label>
    <label>Name<input name="name"></label>
    <label>Company<input name="company"></label>
    <label>Plan<select name="plan"><option value="">None yet</option><option value="launch">Launch</option><option value="growth">Growth</option><option value="scale">Scale</option><option value="dominate">Dominate</option></select></label>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn pri" value="ok">Add</button></div>
  </form>
</dialog>
<dialog id="mailDlg">
  <h3>Email the client</h3>
  <label>Template<select id="mTpl"></select></label>
  <label>To<input id="mTo"></label>
  <label>Subject<input id="mSubj"></label>
  <label>Message<textarea id="mBody"></textarea></label>
  <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button class="btn" id="mClose">Close</button><button class="btn" id="mCopy">Copy text</button><button class="btn pri" id="mOpen">Open in my email</button></div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  // ===== basics =====
  var L={lead:'Lead (audit)',reserved:'Reserved',checkout:'At checkout',paid:'Paid',onboarding:'Onboarding received',building:'Building',warmup:'Warming up',live:'Live',fullspeed:'Full speed',paused:'Paused',cancelled:'Cancelled'};
  var STAGES=Object.keys(L), ACTIVE=['paid','onboarding','building','warmup','live','fullspeed'];
  var PLANS={launch:{name:'Launch',price:1097,lo:5,hi:12,emails:5000},growth:{name:'Growth',price:1977,lo:10,hi:25,emails:10000},scale:{name:'Scale',price:3297,lo:20,hi:50,emails:20000},dominate:{name:'Dominate',price:5497,lo:40,hi:100,emails:40000}};
  var KINDS=['Target list','Sample emails','Sending setup','Weekly report','Monthly report','Strategy notes','Other'];
  var KEY=null,clients=[],view='today',filter='active',sel=null,cur=null,curDates=null,tab='overview';
  function $(id){return document.getElementById(id)}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function store(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
  function read(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function toast(t){var el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('on')},2300)}
  function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function addDays(s,n){var p=s.split('-'),d=new Date(+p[0],p[1]-1,+p[2]+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function addMonths(s,k){if(!s)return '';var p=s.split('-'),d=new Date(+p[0],p[1]-1+k,+p[2]);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function fd(s){if(!s)return '';var p=String(s).slice(0,10).split('-');if(p.length<3)return s;return new Date(+p[0],p[1]-1,+p[2]).toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'})}
  function fdt(s){if(!s)return '';var d=new Date(s);return isNaN(d)?s:d.toLocaleString([],{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
  function ago(iso){if(!iso)return '';var s=(Date.now()-new Date(iso))/1000;if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';if(s<86400*30)return Math.floor(s/86400)+'d ago';return fd(iso)}
  function money(n){return '$'+Math.round(n).toLocaleString('en-US')}
  function n(x){return (x||0).toLocaleString('en-US')}
  function first(c){return (c.name||'').split(' ')[0]||'there'}
  function pill(s){return '<span class="pill s-'+esc(s)+'">'+esc(L[s]||s)+'</span>'}
  function api(action,o){o=o||{};
    return fetch('/api/crm?action='+action+(o.q||''),{method:o.body?'POST':'GET',headers:{'Content-Type':'application/json','x-admin-key':KEY},body:o.body?JSON.stringify(o.body):undefined})
      .then(function(r){return r.json().then(function(j){if(!r.ok){var e=new Error(j.error||('Error '+r.status));e.code=r.status;e.data=j;throw e}return j})})}
  function portalUrl(c){return location.origin+'/portal.html?t='+encodeURIComponent(c.token)}
  function monthShown(c,m){return (c.weeks||[]).filter(function(w){return w.week.slice(0,7)===m}).reduce(function(a,w){return a+(w.showed||0)},0)}

  // ===== login =====
  function start(k){KEY=k;$('loginErr').textContent='';
    return api('list').then(function(j){store('cr_admin',k);$('login').style.display='none';$('app').style.display='block';clients=j.clients;renderAll()})
      .catch(function(e){KEY=null;store('cr_admin',null);$('login').style.display='block';$('app').style.display='none';$('loginErr').textContent=e.code===403?'That key is not right.':e.message})}
  $('loginForm').addEventListener('submit',function(e){e.preventDefault();start($('key').value.trim())});
  $('logout').onclick=function(){store('cr_admin',null);location.reload()};
  $('refresh').onclick=function(){reload(true)};
  function reload(msg){return api('list').then(function(j){clients=j.clients;renderAll();if(sel&&view==='clients')openClient(sel,true);if(msg)toast('Up to date')}).catch(function(e){toast(e.message)})}
  var saved=read('cr_admin');if(saved)start(saved);

  // ===== views =====
  document.querySelector('.nav').addEventListener('click',function(e){var b=e.target.closest('[data-view]');if(b)go(b.dataset.view)});
  function go(v){view=v;document.querySelectorAll('.nav [data-view]').forEach(function(b){b.setAttribute('aria-current',b.dataset.view===v?'page':'false')});
    $('vToday').hidden=v!=='today';$('vClients').hidden=v!=='clients';$('vBoard').hidden=v!=='board';renderAll()}
  $('q').addEventListener('input',function(){if(view!=='clients')go('clients');else renderList()});
  function renderAll(){var items=needs();var nc=$('needCount');nc.hidden=!items.length;nc.textContent=items.length;
    if(view==='today')renderToday(items);if(view==='clients'){renderChips();renderList()}if(view==='board')renderBoard()}

  // ===== Today =====
  function needs(){var t=today(),out=[];
    clients.forEach(function(c){var who=c.company||c.name||c.email;
      if(c.openRequests)out.push({p:1,tag:'red',k:'Message',text:c.openRequests+' open message'+(c.openRequests>1?'s':'')+' from the client',c:c,tab:'messages'});
      (c.changes||[]).forEach(function(t){out.push({p:1,tag:'red',k:'Changes',text:'Asked for changes on "'+t+'"',c:c,tab:'deliverables'})});
      if(c.flagged)out.push({p:1,tag:'red',k:'Meeting',text:c.flagged+' meeting'+(c.flagged>1?'s':'')+' marked not a fit. Review within 48 hours',c:c,tab:'meetings'});
      if(c.billingStatus==='overdue')out.push({p:1,tag:'red',k:'Billing',text:'Payment is overdue',c:c,tab:'info'});
      if(c.stage==='reserved')out.push({p:2,tag:'amber',k:'Payment',text:'Reserved a spot. Send their Stripe payment link',c:c,tab:'info',mail:'paylink'});
      if(c.stage==='checkout')out.push({p:3,tag:'amber',k:'Checkout',text:'Went to Stripe checkout. Check Stripe for the payment',c:c,tab:'info'});
      if(c.stage==='paid')out.push({p:2,tag:'amber',k:'Onboarding',text:'Paid but no onboarding form yet. Nudge them',c:c,tab:'overview'});
      (c.tasksDue||[]).forEach(function(x){var late=x.due<t;out.push({p:late?1:2,tag:late?'red':'blue',k:late?'Overdue':'Due',text:x.title+' ('+(late?'was due ':'due ')+fd(x.due)+')',c:c,tab:'checklist'})});
      if((c.stage==='live'||c.stage==='fullspeed')&&(!c.lastWeek||c.lastWeek<addDays(t,-8)))out.push({p:2,tag:'blue',k:'Numbers',text:'Post this week\'s numbers',c:c,tab:'numbers'});
      if(c.minimumEnds&&ACTIVE.indexOf(c.stage)>=0&&c.minimumEnds>=t&&c.minimumEnds<=addDays(t,30))out.push({p:3,tag:'grey',k:'Renewal',text:'3-month minimum ends '+fd(c.minimumEnds)+'. Send the results summary',c:c,tab:'numbers',mail:'minimum'});
      out.forEach(function(o){o.who=o.who||who});
    });
    return out.sort(function(a,b){return a.p-b.p})}
  function renderToday(items){var t=today(),m=t.slice(0,7);
    var act=clients.filter(function(c){return ACTIVE.indexOf(c.stage)>=0});
    var mrr=act.filter(function(c){return c.billingStatus!=='paused'&&c.billingStatus!=='ended'}).reduce(function(a,c){return a+((PLANS[c.plan]||{}).price||0)},0);
    var shown=act.reduce(function(a,c){return a+(c.monthShown||0)},0);
    var meetings=clients.reduce(function(a,c){return a+(c.meetingsSoon||0)},0);
    var leads=clients.filter(function(c){return c.stage==='lead'||c.stage==='reserved'||c.stage==='checkout'});
    var h='<div class="kpis">'+
      '<div class="kpi"><b>'+act.length+'</b><span>active clients</span></div>'+
      '<div class="kpi"><b>'+money(mrr)+'</b><span>monthly revenue (active plans)</span></div>'+
      '<div class="kpi"><b>'+shown+'</b><span>shown meetings this month</span></div>'+
      '<div class="kpi"><b>'+meetings+'</b><span>meetings booked in the next 7 days</span></div>'+
      '<div class="kpi"><b>'+leads.length+'</b><span>leads and reserved spots</span></div></div>';
    h+='<div class="two"><div class="box"><h2>Needs you <small>'+(items.length?items.length+' thing'+(items.length>1?'s':''):'all clear')+'</small></h2>'+
      (items.length?items.map(function(o,i){return '<div class="need"><span class="tag '+o.tag+'">'+esc(o.k)+'</span><div>'+esc(o.text)+'<div class="who">'+esc(o.who)+'</div></div><div style="display:flex;gap:6px">'+(o.mail?'<button class="btn sm" data-need-mail="'+i+'">Email</button>':'')+'<button class="btn sm" data-need="'+i+'">Open</button></div></div>'}).join('')
      :'<div class="empty">Nothing waiting on you. New messages, approvals, due tasks and payments show up here.</div>')+'</div>';
    var act2=clients.slice().sort(function(a,b){return a.updatedAt<b.updatedAt?1:-1}).slice(0,8);

  function submitForm(form,btn){var k=form.dataset.form,v=vals(form);
    var need={task:'title',deliv:'title',meet:'prospect',todo:'title',update:'text',week:'sent'}[k];

      var done=function(){btn.disabled=false};

        var rd=new FileReader();rd.onload=function(){var data=String(rd.result).split(',')[1]||'';

        rd.onerror=function(){toast('Could not read that file');done()};rd.readAsDataURL(file)}
      else addIt('').catch(function(){}).then(done);
    }
  }

  $('mOpen').onclick=function(){location.href='mailto:'+encodeURIComponent($('mTo').value)+'?subject='+encodeURIComponent($('mSubj').value)+'&body='+encodeURIComponent($('mBody').value)};

  // ===== add client, export =====
  $('addBtn').onclick=function(){$('addForm').reset();$('addDlg').showModal()};
  $('addForm').addEventListener('submit',function(e){if(e.submitter&&e.submitter.value==='cancel')return;e.preventDefault();
    var f={};new FormData(this).forEach(function(v,k){f[k]=String(v).trim()});
    api('create',{body:f}).then(function(j){$('addDlg').close();cur=j.client;curDates=j.dates;mergeSummary(j.client);tab='overview';openFrom(j.client.id);toast('Client added')})
      .catch(function(err){if(err.code===409){$('addDlg').close();tab='overview';openFrom(err.data.id);toast('Already in the CRM, opened it')}else toast(err.message)})});
  $('exportBtn').onclick=function(){api('list',{q:'&full=1'}).then(function(j){
    var cols=['Company','Name','Email','Phone','Website','Plan','Monthly price','Stage','Start date','Minimum ends','Billing','Shown meetings this month','Open messages','Portal link'];
    var rows=j.clients.map(function(c){var p=PLANS[c.plan],s=c.billing&&c.billing.startDate,me='';if(s){var x=s.split('-');var d=new Date(+x[0],x[1]-1+3,+x[2]);me=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
      return [c.company,c.name,c.email,c.phone,c.website,p?p.name:'',p?p.price:'',L[c.stage]||c.stage,s||'',me,(c.billing||{}).status||'',monthShown(c,today().slice(0,7)),(c.requests||[]).filter(function(q){return q.status==='open'}).length,portalUrl(c)]});
    var csv=[cols].concat(rows).map(function(r){return r.map(function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')}).join('\n');
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='clientready-clients-'+today()+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500);toast('Exported '+rows.length+' clients')}).catch(function(e){toast(e.message)})};
})();
</script>
</body>
</html>
